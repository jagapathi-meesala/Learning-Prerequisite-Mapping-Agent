name: identify-prerequisite-gaps
description: Identify prerequisite topics not marked as learned in the supplied topic map.
input_schema:
  type: object
  required:
    - topics
    - target_topic
  properties:
    topics:
      type: array
      items:
        type: object
    target_topic:
      type: string
    learned_topics:
      type: array
      items:
        type: string
